[package]
name = "curupira-stack"
version = "0.1.0"
description = "Stack curupira site profiles and workspaces from system, user and repo layers via shikumi"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "curupira_stack"
path = "src/lib.rs"

[[bin]]
name = "curupira-stack"
path = "src/main.rs"

[dependencies]
curupira-sites = { path = "../curupira-sites" }
shikumi = "0.1"
figment = "0.10"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
